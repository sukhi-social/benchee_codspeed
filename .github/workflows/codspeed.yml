# Runs bench/benchmarks.exs with CodSpeed in walltime mode, on CodSpeed
# macro runners. The benchmarks use benchee_codspeed itself to report results
# and to tell the runner when each benchmark starts and stops.
name: codspeed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: codspeed-macro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.20"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        env:
          # Writes the perf map, so that BEAM functions have names in the flame graph.
          ELIXIR_ERL_OPTIONS: "+JPperf true"
        with:
          mode: walltime
          run: mix run bench/benchmarks.exs
